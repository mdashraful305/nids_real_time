# Local Suricata alert threshold/suppression for live LAN NIDS capture.
# Paired with `-k none` (`--set stream.checksum-validation=no`), this suppresses
# local NIC checksum-offload decoder false alerts and SOHO router DHCP quirks
# while keeping all ET threat signatures, HTTP/TLS/DNS parsers, and TCP stream
# flood/anomaly alerts active.

suppress gen_id 1, sig_id 2200074
suppress gen_id 1, sig_id 2200076
suppress gen_id 1, sig_id 2200077
suppress gen_id 1, sig_id 2200078
suppress gen_id 1, sig_id 2227001
